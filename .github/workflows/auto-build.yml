name: ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          build-tools-version: 34.0.0
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: closenow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          status_icon() {
            case "$1" in
              success) printf '✅ success' ;;
              failure) printf '❌ failure' ;;
              cancelled) printf '❌ cancelled' ;;
              skipped) printf '⏭️ skipped' ;;
              *) printf '❌ %s' "$1" ;;
            esac
          }

          {
            echo "## CI Summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Build | $(status_icon '${{ job.status }}') |"
            echo "| Unit Tests | $(status_icon '${{ job.status }}') |"
            echo "| Lint | $(status_icon '${{ job.status }}') |"
            echo
            echo "Job summary generated at run-time"
          } >> "$GITHUB_STEP_SUMMARY"
